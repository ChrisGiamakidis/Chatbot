<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Rasa Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Rasa Webchat library -->
  <script src="https://cdn.jsdelivr.net/npm/rasa-webchat@1.0.1/lib/index.js"></script>
  <style>
    body {
      background-image: url('road.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Inter', sans-serif;
    }
    #offline {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #offline.show { display: flex; }
    #offline .card {
      background: #fff;
      max-width: 420px;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    #offline h2 { margin: 0 0 8px; font-size: 1.2rem; }
    #offline p { margin: 0 0 16px; color: #333; line-height: 1.4; }
    #offline button {
      margin: 4px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #1a73e8;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    #offline button:disabled { background: #999; cursor: default; }
    #status { margin-top: 12px; font-size: 0.9rem; color: #333; min-height: 1.2em; }
  </style>
</head>
<body>
  <div id="offline">
    <div class="card">
      <h2>Ο ψηφιακός βοηθός είναι προσωρινά εκτός σύνδεσης</h2>
      <p>
        Ο διαχειριστής δεν τον έχει ενεργοποιήσει ακόμα. Μπορείτε να τον ειδοποιήσετε
        με ένα κλικ. Κρατήστε τη σελίδα ανοιχτή και θα συνδεθεί αυτόματα μόλις ο βοηθός
        γίνει διαθέσιμος.
      </p>
      <button id="notifyBtn">Ειδοποίηση διαχειριστή</button>
      <button id="retryBtn">Δοκιμάστε ξανά</button>
      <div id="status"></div>
    </div>
  </div>

  <script>
    const BOT_URL = "https://abstain-stitch-duly.ngrok-free.dev"; // no trailing slash
    const WEB3FORMS_KEY = "1a505b5a-34f3-4ae2-9aca-097f735d62f0";
    const NOTIFY_COOLDOWN_MS = 30 * 60 * 1000; // one email per visitor per 30 min
    const CHECK_EVERY_MS = 15000;              // retry every 15 s while offline
    const MAX_CHECKS = 40;                     // ...for up to 10 minutes

    const offlineBox = document.getElementById("offline");
    const notifyBtn = document.getElementById("notifyBtn");
    const retryBtn = document.getElementById("retryBtn");
    const statusEl = document.getElementById("status");

    let chatStarted = false;
    let pollTimer = null;

    // The bot counts as online only if Rasa answers with a normal CORS response.
    // The ngrok header skips ngrok's free-plan warning page for this request.
    async function botIsOnline() {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 6000);
      try {
        const res = await fetch(BOT_URL + "/", {
          signal: controller.signal,
          headers: { "ngrok-skip-browser-warning": "1" }
        });
        return res.ok;
      } catch (e) {
        return false;
      } finally {
        clearTimeout(timer);
      }
    }

    function startChat() {
      if (chatStarted) return;
      chatStarted = true;
      offlineBox.classList.remove("show");

      // Clear any old session data
      sessionStorage.clear();
      localStorage.clear();

      WebChat.default({
        initPayload: "/greet",
        customData: {"language": "el"},
        socketUrl: BOT_URL,
        socketPath: "/socket.io/",
        title: "ChatBot Ευφυούς Ταχογράφου",
        subtitle: "Ψηφιακός βοηθός",
        inputTextFieldHint: "Πληκτρολογήστε το μήνυμά σας...",
        connectingText: "Συνδέεται...",
        hideWhenNotConnected: true,
        showFullScreenButton: true,
        params: {
          storage: "session"
        }
      });
    }

    function startPolling() {
      clearInterval(pollTimer);
      let checks = 0;
      pollTimer = setInterval(async function () {
        checks++;
        if (await botIsOnline()) {
          clearInterval(pollTimer);
          startChat();
        } else if (checks >= MAX_CHECKS) {
          clearInterval(pollTimer);
          statusEl.textContent = "Η αυτόματη επανασύνδεση σταμάτησε. Πατήστε «Δοκιμάστε ξανά».";
        }
      }, CHECK_EVERY_MS);
    }

    async function notifyOwner() {
      const last = Number(localStorage.getItem("notifiedAt") || 0);
      if (Date.now() - last < NOTIFY_COOLDOWN_MS) {
        notifyBtn.disabled = true;
        statusEl.textContent = "Ο διαχειριστής έχει ήδη ειδοποιηθεί πρόσφατα. Κρατήστε τη σελίδα ανοιχτή.";
        return;
      }

      notifyBtn.disabled = true;
      statusEl.textContent = "Αποστολή...";
      try {
        const res = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({
            access_key: WEB3FORMS_KEY,
            subject: "Chatbot: ένας επισκέπτης περιμένει",
            from_name: "Chatbot website",
            message:
              "Ένας επισκέπτης προσπάθησε να χρησιμοποιήσει το chatbot ενώ ήταν εκτός σύνδεσης. " +
              "Ώρα: " + new Date().toLocaleString("el-GR") + ". " +
              "Ανοίξτε το laptop και ξεκινήστε το Rasa και το tunnel.",
            botcheck: ""
          })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          localStorage.setItem("notifiedAt", String(Date.now()));
          statusEl.textContent = "Ο διαχειριστής ειδοποιήθηκε. Κρατήστε τη σελίδα ανοιχτή· θα συνδεθεί αυτόματα.";
        } else {
          throw new Error(data.message || "send failed");
        }
      } catch (e) {
        statusEl.textContent = "Δεν ήταν δυνατή η αποστολή. Δοκιμάστε ξανά αργότερα.";
        notifyBtn.disabled = false;
      }
    }

    notifyBtn.addEventListener("click", notifyOwner);

    retryBtn.addEventListener("click", async function () {
      statusEl.textContent = "Έλεγχος σύνδεσης...";
      if (await botIsOnline()) {
        clearInterval(pollTimer);
        startChat();
      } else {
        statusEl.textContent = "Ο βοηθός δεν είναι ακόμα διαθέσιμος.";
        startPolling();
      }
    });

    document.addEventListener("DOMContentLoaded", async function () {
      if (await botIsOnline()) {
        startChat();
      } else {
        offlineBox.classList.add("show");
        startPolling();
      }
    });
  </script>
</body>
</html>
