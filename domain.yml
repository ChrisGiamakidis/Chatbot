version: "3.1"

intents:
  - greet
  - goodbye
  - bot_challenge
  - thank_you
  - ask_general_description 
  - ask_documents_required
  - ask_card_cost
  - ask_competent_authority
  - ask_requirements
  - ask_contact_info
  - ask_card_purpose
  - ask_who_needs_card
  - ask_how_to_apply
  - ask_where_to_apply
  - ask_how_long_issuance
  - ask_how_to_receive_card
  - ask_upload_issue
  - ask_modify_application
  - ask_card_not_arrived
  - ask_card_duration
  - ask_what_data
  - ask_if_data_safe
  - inform_application_method
  - ask_what_output

entities:
  - application_method

slots:
  application_method:
    type: categorical
    values:
      - online
      - in_person
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: application_method
        intent: inform_application_method

forms:
  document_application_form:
    required_slots:
      - application_method

actions:
  - action_dynamic_greet_menu
  - action_provide_help_link
  - validate_document_application_form
  - action_activate_document_form

responses:
  utter_greet:
    - text: "Γεια σας! Είμαι εδώ για να δώσω πληροφορίες σχετικά με την Κάρτα Ευφυούς Ταχογράφου Οδηγού. Πώς μπορώ να σας εξυπηρετήσω;"

  utter_goodbye:
    - text: "Καλή συνέχεια! Αν χρειαστείτε κάτι άλλο, είμαι στη διάθεση σας."

  utter_bot_challenge:
    - text: "Είμαι ένα chatbot που σχεδιάστηκε για να απαντάω σε ερωτήσεις σχετικά με την Κάρτα Ευφυούς Ταχογράφου Οδηγού."

  utter_fallback:
    - text: "Συγγνώμη, δεν κατάλαβα την ερώτησή σου. Μπορείς να την διατυπώσεις διαφορετικά ή να ρωτήσεις κάτι σχετικό με την έκδοση κάρτας ταχογράφου;"

  utter_general_description:
    - text: "Η Κάρτα Ευφυούς Ταχογράφου Οδηγού είναι ένα προσωπικό ψηφιακό έγγραφο που καταγράφει διάφορες παραμέτρους οδήγησης σε ταχογράφους νέας γενιάς. Είναι απαραίτητη για τους οδηγούς επαγγελματικών οχημάτων."
    - text: "Η Κάρτα Ευφυούς Ταχογράφου Οδηγού είναι μια προσωπική κάρτα που χρησιμοποιείται από επαγγελματίες οδηγούς για την αυτόματη παρακολούθηση και τεκμηρίωση των δραστηριοτήτων οδήγησης."

  utter_ask_application_method:
    - text: "Θέλετε να μάθετε τα δικαιολογητικά που απαιτούνται για την έκδοση της κάρτας ηλεκτρονικά μέσω gov.gr ή σε κάποιο Κέντρο Εξυπηρέτησης Πολιτών;"
      buttons:
        - title: "Ηλεκτρονικά (gov.gr)"
          payload: '/inform_application_method{"application_method": "online"}'
        - title: "ΚΕΠ"
          payload: '/inform_application_method{"application_method": "in_person"}'
  
  utter_citizenship_status:
    - text: "Για την **παραλαβή** της κάρτας θα χρειαστείτε:\n* έαν είστε Έλληνας πολίτης, δελτίο Αστυνομικής Ταυτότητας ή Διαβατήριο\n* έαν είστε πολίτης κράτους μέλους της Ε.Ε., βεβαίωση εγγραφής\n* έαν είστε πολίτης κράτους εκτός της Ε.Ε., άδεια παραμονής"

  utter_ask_card_cost:
    - text: "Το κόστος για την έκδοση της κάρτας ανέρχεται στα 150€. Ο κωδικός του e-παραβόλου είναι: 0041. Η πληρωμή μπορεί να πραγματοποιηθεί μέσω:\n* ΕΛΤΑ\n* Ταμείου Τραπέζης\n* Ψηφιακά (χρεωστική/πιστωτική κάρτα ή web banking)"

  utter_competent_authority:
    - text: "Αρμόδια αρχή για την έκδοση της κάρτας είναι το Υπουργείο Υποδομών και Μεταφορών, μέσω των κατά τόπους διευθύνσεων του."

  utter_requirements:
    - text: "Για την έκδοση της κάρτας απαιτείται:\n* να είστε κάτοχος άδειας οδήγησης κατηγορίας C1, C1E, C, CE, D1, D1E, D, DE σε ισχύ \n* να διαμένετε μόνιμα στην Ελλάδα \n* να είστε κάτοχος κωδικών TAXISnet"

  utter_ask_card_purpose:
    - text: "Η κάρτα επιτρέπει την ασφαλή αποθήκευση και ανάγνωση των δεδομένων οδήγησης από τον ευφυή ταχογράφο."

  utter_ask_who_needs_card:
    - text: "Η κάρτα είναι υποχρεωτική για όλους τους επαγγελματίες οδηγούς που τα οχήματά τους έχουν ταχογράφο."

  utter_ask_where_to_apply:
    - text: "Η αίτηση γίνεται είτε ηλεκτρονικά μέσω της [Ενιαίας Ψηφιακής Πύλης Δημόσιας Διοίκησης] (https://www.gov.gr/ipiresies/epikheirematike-drasterioteta/adeiodoteseis-kai-summorphose/karta-psephiakou-takhographou-odegou), είτε δια ζώσης σε κάποιο ΚΕΠ."

  utter_ask_how_to_apply:
    - text: "Θα πρέπει να υποβάλετε αίτηση με τα απαιτούμενα δικαιολογητικά σε κάποιο ΚΕΠ ή μέσω της ενιαίας ψηφιακής πύλης gov.gr. Η διαδικασία περιλαμβάνει τα εξής βήματα:\n* Συμπλήρωση της αίτησης.\n* Υποβολή των απαραίτητων εγγράφων.\n* Καταβολή του προβλεπόμενου παραβόλου.\n* Παραλαβή της κάρτας μόλις εκδοθεί."

  utter_ask_how_long_issuance:
    - text: "Η έκδοση της κάρτας διαρκεί συνήθως 5 έως 15 εργάσιμες ημέρες από την ημερομηνία υποβολής της αίτησης."

  utter_ask_how_to_receive_card:
    - text: "Η παραλαβή της κάρτας γίνεται από την Περιφερειακή Διεύθυνση Μεταφορών και Επικοινωνιών που δηλώσατε στην αίτηση."

  utter_ask_upload_issue:
    - text: "Βεβαιωθείτε ότι τα αρχεία σας είναι τύπου: .jpg, .jpeg, .png, .gif.\n* Για την φωτογραφία τύπου διαβατηρίου σε ψηφιακή μορφή, η ανάλυση πρέπει να είναι τουλάχιστον 800x1200 pixels.\n* Για την ψηφιακή εικόνα της φυσικής υπογραφής σας σε λευκό χαρτί, η ανάλυση πρέπει να είναι τουλάχιστον 1200x480 pixels.\n* Επίσης, μπορείτε να επικοινωνήσετε με την υπηρεσία υποστήριξης του gov.gr ή να καταθέσετε την αίτηση δια ζώσης."

  utter_ask_modify_application:
    - text: "Αν η αίτηση δεν έχει προχωρήσει, μπορείτε να την ακυρώσετε και να υποβάλετε νέα. Σε κάθε περίπτωση, αν έχει γίνει κάποιο λάθος, επικοινωνήστε με την Διεύθυνση Μεταφορών και Επικοινωνιών της περιοχής σας."

  utter_ask_card_not_arrived:
    - text: "Η προθεσμία για την έκδοση της κάρτας είναι από 5 έως 15 εργάσιμες ημέρες. Μετά την παρέλευση αυτού του χρονικού διαστήματος, επικοινωνήστε με τη Διεύθυνση Μεταφορών και Επικοινωνιών της περιοχής σας για περαιτέρω ενημέρωση."

  utter_ask_card_duration:
    - text: "Η κάρτα ισχύει για 5 έτη από την ημερομηνία έκδοσης της."

  utter_ask_what_data:
    - text: "Η κάρτα καταγράφει δεδομένα όπως ώρες οδήγησης, περιόδους ανάπαυσης, ταχύτητα οχήματος και απόσταση που διανύθηκε. Αυτά τα δεδομένα είναι κρίσιμα για την τήρηση των κανονισμών εργασίας των οδηγών."

  utter_ask_if_data_safe:
    - text: "Τα δεδομένα της κάρτας προστατεύονται σύμφωνα με τον Γενικό Κανονισμό Προστασίας Δεδομένων (GDPR). Επιπλέον η διαδικασία έκδοσης της κάρτας συμμορφώνεται με τις εξής νομοθεσίες:\n* Ευρωπαϊκός Κανονισμός 68/2016\n* Ευρωπαϊκός Κανονισμός 165/2014\n* Κοινή Υπουργική Απόφαση 262593/2022 (ΦΕΚ 4615/Β)\n* Υπουργική Απόφαση 12527/1159/2014 (ΦΕΚ 577/Β)\n* Υπουργική Απόφαση 22143/Γ2/2008 (ΦΕΚ 357/Β)"
  
  utter_ask_what_output:
    - text: "Με την ολοκλήρωση της διαδικασίας εκδίδεται η προσωπική κάρτα ευφυούς ταχογράφου και ενημερώνεται το μητρώο του Υπουργείου Υποδομών και Μεταφορών."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
